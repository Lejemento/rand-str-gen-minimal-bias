  <title>偏りにくいランダム文字列の作成（パスワードなど）</title>
  <link rel="icon" href="/icon.png">

<body>
  <div class="box-root">
    <div>
      <div class="box-head">
        <div class="title">偏りにくい<wbr>ランダム<wbr>文字列<wbr>の<wbr>作成</div>
        <div>
          指定した条件で<wbr>ランダムな<wbr>文字列を<wbr>作成します。<wbr>IDや<wbr>パスワードに<wbr>お使いください。<wbr><!--
          -->作成処理は<wbr>お使いの<wbr>デバイス上で<wbr>完結し、<wbr>暗号学的な<wbr>計算によって<wbr>行われます。
        </div>
      </div>
      <div class="box-part">
        <div>▼使用する文字</div>
        <textarea style="height: 4em;" id="tarea-char" placeholder="255文字まで・空白文字は無視"></textarea>
        <div class="box-char">
          <button id="char_reset">リセット</button>
          <button id="char_latnum">大小英数字 aA1</button>
          <button id="char_latnuma">英数字（間違い防止）</button>
          <button id="char_latupp">英大文字 ABC</button>
          <button id="char_latlow">英小文字 abc</button>
          <button id="char_num">数字 123</button>
          <button id="char_base64">Base64</button>
          <button id="char_jahira">ひらがな</button>
          <button id="char_jakata">カタカナ</button>
        </div>
      </div>
    </div>
    <div>
      <div class="box-part">
        <div>▼作成の設定</div>
        <div class="box-settings">
          <div class="range"><div>作成する数</div>
            <input type="number" min="1" value="10" max="100" id="s-round-n"><input type="range" min="1" value="10" max="40" id="s-round-r"></div>
          <div class="range"><div>文字数</div>
            <input type="number" min="4" value="16" max="64" id="s-len-n"><input type="range" min="4" value="16" max="32" id="s-len-r"></div>
          <div class="range"><div>偏りにくさ</div>
            <input type="number" min="0" value="1" max="3" id="s-rare-n"><input type="range" min="0" value="1" max="3" id="s-rare-r"></div>
          <div>結果を上書きしない<input type="checkbox" id="s-notow"></div>
          <div>結果をスペースで区切る<input type="checkbox" id="s-space"></div>
        </div>
      </div>
      <div class="box-gen">
        <button id="button-gen">作成する</button>
      </div>
      <div class="box-part">
        <div>▼作成結果</div>
        <div id="str-warn"></div>
        <textarea style="height: 11em;" id="tarea-result"></textarea>
      </div>
      <div class="str-credit">
        制作：<a target="_blank" href="https://www.nicovideo.jp/user/32513714">レジェメント</a>
      </div>
    </div>
  </div>
  <script>

</body>
</html>
